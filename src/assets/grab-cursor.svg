<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-1 -1 26 26">
  <!-- an open hand, ready to grab (Lucide's shape): soft mint fill, deep green line, white halo for contrast on any background -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f2de"/>
      <stop offset="1" stop-color="#9fd4ab"/>
    </linearGradient>
    <path id="hand" d="M6 14V6a2 2 0 0 1 4 0V4a2 2 0 0 1 4 0V6a2 2 0 0 1 4 0V8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L6 15Z"/>
  </defs>
  <use href="#hand" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
