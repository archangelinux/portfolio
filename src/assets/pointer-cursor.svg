<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-1 -1 26 26">
  <!-- Lucide's pointing hand: soft mint fill, deep green line, white halo so it reads on any photo.
       The hotspot (fingertip) is at 11,4 in the 32px cursor. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f2de"/>
      <stop offset="1" stop-color="#9fd4ab"/>
    </linearGradient>
    <path id="hand" d="M6 14V4a2 2 0 0 1 4 0v5a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L6 15Z"/>
  </defs>
  <use href="#hand" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <use href="#hand" fill="url(#fill)"/>
  <g fill="none" stroke="#2f6b43" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <use href="#hand"/>
    <path d="M10 9v2.5M14 10v2M18 11v1.5"/>
  </g>
</svg>
